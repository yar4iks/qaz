<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Админ вход</title>
  </head>
  <body>
    <h1>Вход администратора</h1>
    {% if error %}
      <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form method="post">
      <label>
        Логин:
        <input type="text" name="username" required />
      </label>
      <br />
      <label>
        Пароль:
        <input type="password" name="password" required />
      </label>
      <br />
      <button type="submit">Войти</button>
    </form>
  </body>
</html>
